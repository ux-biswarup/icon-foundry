<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; font: 11px/1.45 Inter, -apple-system, system-ui, sans-serif; }
      body { margin: 0; padding: 12px; color: var(--figma-color-text); background: var(--figma-color-bg); }
      h1 { font-size: 12px; font-weight: 600; margin: 0 0 2px; }
      p.lede { margin: 0 0 12px; color: var(--figma-color-text-secondary); }
      label { display: block; font-weight: 600; margin: 10px 0 4px; color: var(--figma-color-text-secondary); }
      textarea, button {
        font: inherit; color: inherit; width: 100%; box-sizing: border-box;
        border: 1px solid var(--figma-color-border); border-radius: 4px; padding: 6px 8px;
        background: var(--figma-color-bg-secondary);
      }
      textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; min-height: 90px; resize: vertical; }
      .actions { display: flex; gap: 8px; margin-top: 10px; }
      button.primary { background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); border-color: transparent; font-weight: 600; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .muted { color: var(--figma-color-text-secondary); }
      .error-box { color: var(--figma-color-text-danger); margin-top: 8px; white-space: pre-wrap; }
      .plan { margin-top: 12px; border-top: 1px solid var(--figma-color-border); padding-top: 10px; }
      .counts { display: flex; gap: 12px; margin-bottom: 8px; }
      .counts b { font-size: 14px; display: block; }
      ul.changes { list-style: none; margin: 0; padding: 0; max-height: 190px; overflow: auto; }
      ul.changes li { display: flex; justify-content: space-between; padding: 2px 0; }
      .kind { font-size: 10px; }
      .kind.new { color: var(--figma-color-text-success); }
      .kind.changed { color: var(--figma-color-text-warning); }
      .kind.deprecated { color: var(--figma-color-text-danger); }
      .kind.unchanged { color: var(--figma-color-text-secondary); }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0 0; }
      dt { color: var(--figma-color-text-secondary); }
      dd { margin: 0; }
      section { border-top: 1px solid var(--figma-color-border); margin-top: 14px; padding-top: 10px; }
    </style>
  </head>
  <body>
    <h1>Icon Foundry</h1>
    <p class="lede">Syncs a published set into this file. Icons are made in the studio, not here.</p>

    <label for="payload">Paste the set from the studio</label>
    <textarea id="payload" spellcheck="false" placeholder='Library → Copy for Figma'></textarea>
    <div class="actions">
      <button id="check">Check what would change</button>
    </div>
    <div class="error-box" id="error"></div>

    <div class="plan" id="plan" hidden>
      <div class="counts" id="counts"></div>
      <ul class="changes" id="changes"></ul>
      <div class="actions">
        <button id="sync" class="primary">Sync</button>
      </div>
    </div>

    <section>
      <strong>Selected component</strong>
      <div id="inspect" class="muted">Select an icon to see where it came from.</div>
    </section>

    <div class="actions">
      <button id="cancel">Close</button>
    </div>

    <!--SCRIPT-->
  </body>
</html>
